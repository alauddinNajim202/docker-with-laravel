version: '3.8'

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: laravel_docker_app
        volumes:
            - ./:/var/www
        env_file:
            - .env
        depends_on:
            mysql:
                condition: service_healthy
        restart: unless-stopped


    nginx:
        image: nginx:1.25
        container_name: laravel_docker_nginx
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        restart: unless-stopped


    mysql:
        image: mysql:8.0
        container_name: laravel_docker_mysql
        command: --default-authentication-plugin=mysql_native_password
        ports:
            - "3307:3306"
        environment:
            MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
            MYSQL_DATABASE: laravel_docker
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped


    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: laravel_docker_phpmyadmin
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
        ports:
            - "8080:80"
        depends_on:
            - mysql
        restart: unless-stopped

volumes:
    mysql_data:





